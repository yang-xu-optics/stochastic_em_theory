notes: Local BSV threshold reproduction for the model Ne atom in supplementary Fig.
  IV.2. The BSV driver is represented by a random-phase single-mode intensity distribution
  with g2 approximately 3, and each coherent component is evaluated with the selected
  response model before incoherent ensemble averaging. The TDSE path uses the local
  imaginary-time ground state rather than the supplement's Hamiltonian diagonalization
  and records the actual grid in the manifest. The effective TDSE ensemble applies
  a declared upper-tail quantile cap to prevent a finite Monte Carlo maximum from
  setting the visible high-harmonic plateau; raw BSV statistics are preserved separately.
  The PNG/display CSV additionally apply a declared high-order rolloff to avoid plotting
  needle-like raw FFT bins as an unrealistically flat late-harmonic plateau.
